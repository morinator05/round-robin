<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Round Robin A4{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ css_version }}">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body hx-boost="true">
  <nav>
    <a class="brand" href="/">Round Robin A4</a>
    <a href="/">Overview</a>
    <a href="/stats">Statistics</a>
    {% if user %}
      <a href="/history">History</a>
      <a href="/me">My profile</a>
      {% if user.is_admin %}<a href="/admin">Admin</a>{% endif %}
    {% endif %}
    <a href="/help">How it works</a>
    {% if user %}
      <span class="nav-user">Logged in as {{ person(user) }}</span>
      <form method="post" action="/logout"><button class="link">Log out</button></form>
    {% else %}
      <a class="nav-user" href="/login">Log in</a>
    {% endif %}
  </nav>
  <main>
    {% for kind, msg in messages %}<div class="flash {{ kind }}">{{ msg }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
