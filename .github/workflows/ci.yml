name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e1
          POSTGRES_PASSWORD: e1
          POSTGRES_DB: e1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e1"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://e1:e1@localhost:5432/e1_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # The migrations build the same schema as the models (tests use the models directly).
      # Runs on the still empty test database; pytest recreates the schema afterwards.
      - name: Migrations
        env:
          # The app's settings are loaded (for the database URL) and require a key.
          SECRET_KEY: ci-only-secret-key-that-is-long-enough-0123456789
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest
