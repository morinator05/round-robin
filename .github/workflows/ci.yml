name: CI

on:
  push:
    branches: [main]
    # A release (`gh release create v1.3.0`) pushes its tag; that publishes the image.
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Only PRs: a second push to main or a release must not stop the first halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e1
          POSTGRES_PASSWORD: e1
          POSTGRES_DB: e1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e1"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://e1:e1@localhost:5432/e1_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # The migrations build the same schema as the models (tests use the models directly).
      # Runs on the still empty test database; pytest recreates the schema afterwards.
      - name: Migrations
        env:
          # The app's settings are loaded (for the database URL) and require a key.
          SECRET_KEY: ci-only-secret-key-that-is-long-enough-0123456789
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest

  # Builds the Docker image natively on both architectures (amd64 servers, arm64 Raspberry
  # Pi) and starts it against an empty database: migrations apply and the login page loads.
  image:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e1
          POSTGRES_PASSWORD: e1
          POSTGRES_DB: e1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e1"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: round-robin:ci
          cache-from: type=gha,scope=${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=${{ runner.arch }}
      - name: Start the image
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgresql+asyncpg://e1:e1@localhost:5432/e1 \
            -e SECRET_KEY=ci-only-secret-key-that-is-long-enough-0123456789 \
            round-robin:ci
          for _ in $(seq 60); do
            if curl -fsS -o /dev/null localhost:8000/login; then
              echo "The app answers."
              exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1
      - name: Compose file is valid
        run: cp .env.example .env && docker compose config -q

  # A release: the image for both architectures to ghcr.io/morinator05/round-robin, tagged
  # 1.3.0, 1.3, 1 and latest. Servers follow their major version (`1`) at night
  # (deploy/update.sh), so a breaking 2.0.0 waits until someone switches them over.
  publish:
    needs: [lint, test, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=X64
            type=gha,scope=ARM64
