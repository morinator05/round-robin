services:
  db:
    image: postgres:16-alpine
    environment:
      # From .env. Only applied when the database volume is first created: an existing
      # database keeps its user and name, so set them in .env to match it.
      POSTGRES_USER: ${POSTGRES_USER:-e1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-e1}
    ports:
      # Only reachable from this machine; the app container uses the internal network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # All settings from .env; DATABASE_URL below overrides the localhost one in there.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-e1}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-e1}
    ports:
      - "8000:8000"

volumes:
  pgdata:
